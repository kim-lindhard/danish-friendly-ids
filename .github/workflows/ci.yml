name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test DanishFriendlyIds.slnx
      - run: dotnet pack DanishFriendlyIds/DanishFriendlyIds.csproj --configuration Release --output out
